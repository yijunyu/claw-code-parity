name: Rust CI (Fast Build)

# Optional accelerated release build using cargo-slicer.
# Runs alongside the normal Rust CI — does not gate merges.
# Stubs unreachable library functions at MIR level to skip LLVM codegen,
# saving ~27% wall time on typical CI runners.
#
# See: https://github.com/nickel-org/cargo-slicer

on:
  push:
    branches:
      - main
      - 'gaebal/**'
    paths:
      - .github/workflows/rust-ci-fast.yml
      - rust/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rust-ci-fast.yml
      - rust/**
  workflow_dispatch:

concurrency:
  group: rust-ci-fast-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  build-fast:
    name: Build (Fast — cargo-slicer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustc-dev, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          prefix-key: fast-build

      - name: Install cargo-slicer
        run: |
          cargo install cargo-slicer --locked 2>/dev/null \
            || cargo install cargo-slicer
          cargo +nightly install cargo-slicer --profile release-rustc \
            --bin cargo-slicer-rustc --bin cargo_slicer_dispatch \
            --features rustc-driver --locked 2>/dev/null \
            || echo "MIR-precise mode unavailable; falling back to syn pre-analysis"

      - name: Pre-analyze workspace
        run: cargo-slicer pre-analyze || echo "pre-analyze skipped"

      - name: Build (sliced)
        run: |
          if command -v cargo_slicer_dispatch &>/dev/null; then
            echo "=== Building with cargo-slicer ==="
            CARGO_SLICER_VIRTUAL=1 CARGO_SLICER_CODEGEN_FILTER=1 \
              RUSTC_WRAPPER=$(which cargo_slicer_dispatch) \
              cargo +nightly build --release --verbose
          else
            echo "=== cargo-slicer unavailable, plain nightly build ==="
            cargo +nightly build --release --verbose
          fi

      - name: Report binary size
        run: |
          if [ -d target/release ]; then
            echo "=== Release binary sizes ==="
            find target/release -maxdepth 1 -type f -executable \
              -exec ls -lh {} \; 2>/dev/null || true
          fi
